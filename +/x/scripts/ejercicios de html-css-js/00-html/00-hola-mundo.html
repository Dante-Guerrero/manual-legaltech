<!--
Nombre: 00-hola-mundo.html
Tema: Primera pagina HTML
Objetivo: Ver la estructura minima de un archivo HTML.
Como usarlo: abre 00-html/00-hola-mundo.html en tu navegador

Guia de lectura:
- Fila 8: se abre la etiqueta <html>; contiene toda la pagina.
- Fila 13: se agrega <h1>; muestra el titulo principal mas grande.
- Fila 14: se agrega <p>; muestra un texto de apoyo debajo del titulo.
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola mundo</title>
  </head>
  <body>
    <!-- Fila 13: <h1> crea el encabezado principal visible en la pagina. -->
    <h1>Hola, mundo</h1>
    <!-- Fila 14: <p> agrega un parrafo; su efecto es mostrar texto normal debajo del titulo. -->
    <p>Esta es mi primera pagina web.</p>
  </body>
</html>
