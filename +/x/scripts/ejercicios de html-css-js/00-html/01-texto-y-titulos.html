<!--
Nombre: 01-texto-y-titulos.html
Tema: Titulos y parrafos
Objetivo: Usar encabezados y texto descriptivo.
Como usarlo: abre 00-html/01-texto-y-titulos.html en tu navegador

Guia de lectura:
- Fila 13: se agrega <h1>; presenta el tema principal de la pagina.
- Filas 14 y 16: se agregan etiquetas <h2>; dividen el contenido en secciones.
- Filas 15 y 17: se agregan etiquetas <p>; explican cada seccion con texto.
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Texto y titulos</title>
  </head>
  <body>
    <!-- Fila 13: <h1> marca el titulo mas importante de toda la pagina. -->
    <h1>Introduccion al derecho digital</h1>
    <!-- Fila 14: <h2> crea un subtitulo; ayuda a organizar el contenido. -->
    <h2>Que estudia</h2>
    <!-- Fila 15: <p> agrega la descripcion de la seccion anterior. -->
    <p>Estudia los efectos de la tecnologia en las normas, procesos y relaciones entre personas.</p>
    <!-- Fila 16: otro <h2> abre una nueva seccion con menor jerarquia que <h1>. -->
    <h2>Por que importa</h2>
    <!-- Fila 17: este <p> completa la explicacion de la segunda seccion. -->
    <p>Ayuda a entender temas como privacidad, contratos electronicos y firma digital.</p>
  </body>
</html>
