<!--
Nombre: 02-listas-y-enlaces.html
Tema: Listas y enlaces
Objetivo: Mostrar varios elementos y crear enlaces.
Como usarlo: abre 00-html/02-listas-y-enlaces.html en tu navegador

Guia de lectura:
- Fila 13: se agrega <h1>; presenta el bloque principal.
- Fila 14: se agrega <ul>; contiene una lista sin numeros.
- Filas 15 a 17: se agregan <li>; cada uno muestra una tarea distinta.
- Fila 21: se agrega <a>; crea un enlace que abre otra pagina.
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Listas y enlaces</title>
  </head>
  <body>
    <!-- Fila 13: <h1> coloca el titulo principal de la pagina. -->
    <h1>Tareas de hoy</h1>
    <!-- Fila 14: <ul> agrupa varios elementos de lista. -->
    <ul>
      <!-- Fila 15: <li> agrega el primer punto de la lista. -->
      <li>Leer una resolucion</li>
      <!-- Fila 16: este <li> agrega una segunda tarea. -->
      <li>Ordenar expedientes</li>
      <!-- Fila 17: este <li> agrega una tercera tarea visible como vieta. -->
      <li>Enviar un correo</li>
    </ul>

    <!-- Fila 19: <p> agrega un texto normal que incluye un enlace. -->
    <p>
      Puedes buscar mas informacion en
      <!-- Fila 21: <a> crea un enlace; su efecto es permitir abrir MDN en otra pestana. -->
      <a href="https://developer.mozilla.org/es/" target="_blank" rel="noreferrer">MDN en espanol</a>.
    </p>
  </body>
</html>
