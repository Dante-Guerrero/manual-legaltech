<!--
Nombre: 01-colores-y-fondos.html
Tema: Colores y fondos
Objetivo: Practicar background, color y bordes.
Como usarlo: abre 01-css/01-colores-y-fondos.html en tu navegador

Guia de lectura:
- Filas 12 a 16: se agrega el selector body; pone color de fondo y espacio a la pagina.
- Filas 18 a 22: se agrega la clase .aviso; crea una caja blanca con borde lateral azul.
- Fila 26: se agrega <div class="aviso">; recibe los estilos de la clase.
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Colores y fondos</title>
    <style>
      /* Fila 12: body cambia el fondo general y la tipografia de toda la pagina. */
      body {
        font-family: Arial, sans-serif;
        background: #eef2ff;
        padding: 24px;
      }

      /* Fila 18: .aviso estiliza cualquier etiqueta con class="aviso". */
      .aviso {
        background: white;
        border-left: 6px solid #2563eb;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <!-- Fila 26: <div> con class="aviso" crea una caja destacada en pantalla. -->
    <div class="aviso">
      <!-- Fila 27: <h1> muestra el titulo del aviso. -->
      <h1>Aviso importante</h1>
      <!-- Fila 28: <p> agrega el texto explicativo dentro de la caja. -->
      <p>Recuerda revisar la fecha limite antes de enviar la solicitud.</p>
    </div>
  </body>
</html>
