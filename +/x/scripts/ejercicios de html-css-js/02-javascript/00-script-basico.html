<!--
Nombre: 00-script-basico.html
Tema: JavaScript dentro de HTML
Objetivo: Mostrar un mensaje en la consola del navegador.
Como usarlo: abre 02-javascript/00-script-basico.html y revisa la consola

Guia de lectura:
- Fila 13: se agrega <h1>; muestra una instruccion visible en la pagina.
- Fila 15: se agrega <script>; permite escribir JavaScript.
- Fila 16: se usa console.log(); su efecto es mostrar un mensaje en la consola, no en la pagina.
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Script basico</title>
  </head>
  <body>
    <!-- Fila 13: <h1> indica al estudiante que debe abrir la consola del navegador. -->
    <h1>Abre la consola del navegador</h1>

    <!-- Fila 15: <script> contiene el codigo JavaScript que el navegador ejecuta. -->
    <script>
      // Fila 16: console.log() escribe texto en la consola para comprobar que JS funciona.
      console.log("Hola desde JavaScript");
    </script>
  </body>
</html>
